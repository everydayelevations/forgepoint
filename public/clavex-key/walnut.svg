<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" overflow="visible">
  <defs>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2.2" stdDeviation="2.4" flood-color="#2a160a" flood-opacity="0.34"/>
    </filter>
    <clipPath id="ck" clip-rule="evenodd">
      <path d="M11,50 a23,23 0 1,0 46,0 a23,23 0 1,0 -46,0 Z M25.5,50 a8.5,8.5 0 1,1 17,0 a8.5,8.5 0 1,1 -17,0 Z M50,45 H90 V54 H50 Z M83,54 H90 V63 H83 Z M72,54 H78 V60 H72 Z M61,54 H67 V58 H61 Z"/>
    </clipPath>
    <clipPath id="embc"><circle cx="34" cy="50" r="8.5"/></clipPath>
    <linearGradient id="wg" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#6E4A2B"/>
      <stop offset="0.5" stop-color="#4C3019"/>
      <stop offset="1" stop-color="#2A1709"/>
    </linearGradient>
    <linearGradient id="kerf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8D49C"/>
      <stop offset="0.5" stop-color="#D9742F"/>
      <stop offset="1" stop-color="#A83D17"/>
    </linearGradient>
    <radialGradient id="embBody" cx="0.46" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#FFEFC2"/>
      <stop offset="0.28" stop-color="#FBB13C"/>
      <stop offset="0.62" stop-color="#DA5C1C"/>
      <stop offset="1" stop-color="#6E2A0E"/>
    </radialGradient>
    <radialGradient id="embGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF8A2A" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#E8581E" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#E8581E" stop-opacity="0"/>
    </radialGradient>
    <filter id="fFine" filterUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <feTurbulence type="fractalNoise" baseFrequency="0.0308 0.868" numOctaves="5" seed="7" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="luminanceToAlpha" result="a"/>
      <feComponentTransfer in="a" result="b"><feFuncA type="gamma" amplitude="1.5" exponent="3.2" offset="-0.18"/></feComponentTransfer>
      <feFlood flood-color="#1c0f05" result="c"/>
      <feComposite in="c" in2="b" operator="in"/>
    </filter>
    <filter id="fHi" filterUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <feTurbulence type="fractalNoise" baseFrequency="0.0252 0.56" numOctaves="4" seed="18" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="luminanceToAlpha" result="a"/>
      <feComponentTransfer in="a" result="b"><feFuncA type="gamma" amplitude="1.1" exponent="3.6" offset="-0.28"/></feComponentTransfer>
      <feFlood flood-color="#fff0d6" result="c"/>
      <feComposite in="c" in2="b" operator="in"/>
    </filter>
    <filter id="fMot" filterUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <feTurbulence type="fractalNoise" baseFrequency="0.0168 0.07" numOctaves="2" seed="11" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="luminanceToAlpha" result="a"/>
      <feComponentTransfer in="a" result="b"><feFuncA type="linear" slope="0.5" intercept="-0.05"/></feComponentTransfer>
      <feFlood flood-color="#23130a" result="c"/>
      <feComposite in="c" in2="b" operator="in"/>
    </filter>
    <filter id="embTex" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.17" numOctaves="3" seed="24" result="n"/>
      <feColorMatrix in="n" type="luminanceToAlpha" result="a"/>
      <feComponentTransfer in="a" result="b"><feFuncA type="gamma" amplitude="1.4" exponent="2.6" offset="-0.12"/></feComponentTransfer>
      <feFlood flood-color="#431303" result="c"/>
      <feComposite in="c" in2="b" operator="in"/>
    </filter>
    <filter id="embHot" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.42" numOctaves="2" seed="22" result="n"/>
      <feColorMatrix in="n" type="luminanceToAlpha" result="a"/>
      <feComponentTransfer in="a" result="b"><feFuncA type="gamma" amplitude="1.2" exponent="5" offset="-0.42"/></feComponentTransfer>
      <feFlood flood-color="#FFE3A0" result="c"/>
      <feComposite in="c" in2="b" operator="in"/>
