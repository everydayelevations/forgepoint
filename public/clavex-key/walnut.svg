  <g filter="url(#sh)">
    <g clip-path="url(#ck)">
      <rect x="0" y="0" width="100" height="100" fill="url(#wg)"/>
      <rect x="0" y="0" width="100" height="100" filter="url(#fMot)" opacity="0.675" style="mix-blend-mode:multiply"/>
      <rect x="0" y="0" width="100" height="100" filter="url(#fFine)" opacity="0.945" style="mix-blend-mode:multiply"/>
      <rect x="0" y="0" width="100" height="100" filter="url(#fHi)" opacity="0.6075" style="mix-blend-mode:screen"/>
    </g>
    <g clip-path="url(#ck)">
      <polygon points="82,12 88,17 30,90 24,85" fill="url(#kerf)"/>
      <polygon points="82,12 84.5,14 26.5,87 24,85" fill="#FCE9C6" opacity="0.9"/>
    </g>
    <g transform="translate(-0.6,-0.6)">
      <path d="M11,50 a23,23 0 1,0 46,0 a23,23 0 1,0 -46,0 Z" fill="none" stroke="rgba(255,243,222,0.5)" stroke-width="1.4"/>
      <path d="M58,45 H90 V63 H83 V54 H78 V60 H72 V54 H67 V58 H61 V54 H58" fill="none" stroke="rgba(255,243,222,0.5)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
    </g>
    <g transform="translate(0.6,0.7)">
      <path d="M11,50 a23,23 0 1,0 46,0 a23,23 0 1,0 -46,0 Z" fill="none" stroke="rgba(0,0,0,0.4)" stroke-width="1.4"/>
      <path d="M58,45 H90 V63 H83 V54 H78 V60 H72 V54 H67 V58 H61 V54 H58" fill="none" stroke="rgba(0,0,0,0.4)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
    </g>
    <path d="M11,50 a23,23 0 1,0 46,0 a23,23 0 1,0 -46,0 Z" fill="none" stroke="rgba(20,10,4,0.45)" stroke-width="0.9"/>
    <path d="M58,45 H90 V63 H83 V54 H78 V60 H72 V54 H67 V58 H61 V54 H58" fill="none" stroke="rgba(20,10,4,0.45)" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M25.5,50 a8.5,8.5 0 1,0 17,0 a8.5,8.5 0 1,0 -17,0 Z" fill="none" stroke="rgba(0,0,0,0.35)" stroke-width="1"/>
    <circle cx="34" cy="50" r="18.7" fill="url(#embGlow)" style="mix-blend-mode:screen"/>
    <g clip-path="url(#embc)">
      <circle cx="34" cy="50" r="8.5" fill="url(#embBody)"/>
      <rect x="25.5" y="41.5" width="17" height="17" filter="url(#embTex)" opacity="0.55" style="mix-blend-mode:multiply"/>
      <rect x="25.5" y="41.5" width="17" height="17" filter="url(#embHot)" opacity="0.7" style="mix-blend-mode:screen"/>
    </g>
    <circle cx="34" cy="50" r="8.5" fill="none" stroke="rgba(34,10,2,0.6)" stroke-width="1.3"/>
  </g>
</svg>
